name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bun run build
      - name: Verify checked-in distributions
        run: git diff --exit-code -- dist
      - run: bun test
      - run: bun run size
      - run: npm pack --dry-run

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: bun scripts/browser-smoke.js tests/browser.html
      - if: matrix.browser == 'chromium'
        run: bun scripts/browser-smoke.js tests/docs-browser.html
      - run: bun scripts/playwright-test.js --project=${{ matrix.browser }}
