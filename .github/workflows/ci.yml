name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bun run build
      - name: Verify checked-in distributions
        run: git diff --exit-code -- dist
      - run: bun test
      - run: bun run size
      - run: npm pack --dry-run

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - if: matrix.browser == 'chromium'
        run: bun scripts/browser-smoke.js tests/browser.html
      - if: matrix.browser == 'chromium'
        run: bun scripts/browser-smoke.js tests/docs-browser.html
      - run: bun scripts/playwright-test.js --project=${{ matrix.browser }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  next-css:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RAYON_NUM_THREADS: '1'
      TOKIO_WORKER_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/next-css/package-lock.json
      - run: npm ci
      - run: npm ci --prefix examples/next-css
      - run: npm run build --prefix examples/next-css
      - run: npx playwright install --with-deps chromium
      - name: Verify production styles and React interaction ownership
        run: OATBASE_NEXT_FIXTURE=1 bun scripts/playwright-test.js --config examples/next-css/playwright.config.js
      - name: Upload fixture failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-css-failures
          path: test-results/next-css/
          retention-days: 7
